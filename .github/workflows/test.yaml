name: test
on: [push, workflow_dispatch]
jobs:
  cocotb_rtl:
    name: Cocotb RTL
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Run Cocotb RTL tests
        shell: bash
        run: |
          cd test
          make clean
          make
          # make can return 0 even when Cocotb tests fail; enforce zero failures via results.xml
          python -m cocotb_tools.check_results results.xml

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: Upload Cocotb test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cocotb-rtl-results
          path: |
            test/tb.fst
            test/results.xml
            test/output/*

  standalone_rtl:
    name: Standalone Verilog Benches (Sequencer + JTAG TAP)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Compile and run standalone benches cleanly
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_artifacts
          iverilog -g2012 -Wall -s tb_v1_sequencer -o ci_artifacts/seq.vvp src/protocol_sequencer.v test/tb_v1_sequencer.v > ci_artifacts/seq_compile.log 2>&1
          if [ -s ci_artifacts/seq_compile.log ]; then cat ci_artifacts/seq_compile.log; exit 1; fi
          vvp ci_artifacts/seq.vvp | tee ci_artifacts/tb_v1_sequencer.log
          grep -q "^PASS:" ci_artifacts/tb_v1_sequencer.log

          iverilog -g2012 -Wall -s tb_jtag_tap -o ci_artifacts/jtag.vvp src/project.v src/protocol_sequencer.v test/jtag_tap_model.v test/tb_jtag_tap.v > ci_artifacts/jtag_compile.log 2>&1
          if [ -s ci_artifacts/jtag_compile.log ]; then cat ci_artifacts/jtag_compile.log; exit 1; fi
          vvp ci_artifacts/jtag.vvp | tee ci_artifacts/tb_jtag_tap.log
          grep -q "^PASS:" ci_artifacts/tb_jtag_tap.log

      - name: Upload standalone RTL logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: standalone-rtl-logs
          path: ci_artifacts/*.log

  host_suites:
    name: Host Suites (Tools, Contract Audit, Experiments, Autonomous Scan)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Run experiment, tool, contract-audit, and autonomous-scan checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_artifacts
          python -m unittest discover -s experiments -v 2>&1 | tee ci_artifacts/experiments_unittest.log
          python -m unittest discover -s tools -v 2>&1 | tee ci_artifacts/tools_unittest.log
          python tools/contract_audit.py | tee ci_artifacts/contract_audit.md
          python experiments/autonomous_scan_eval.py | tee ci_artifacts/autonomous_scan_eval.json
          python tools/protocol_asm.py --example jtag_idcode > ci_artifacts/jtag_prog.json
          python tools/timing_explorer.py run-example --sim --example jtag > ci_artifacts/jtag_example.json
          python tools/timing_explorer.py scan --sim --delay-ns 37 --start 0 --step 1 --steps 16 --expect 0xAA > ci_artifacts/scan_cli.json
          python tools/timing_explorer.py sweep --sim --delay-ns 23 --min-low 2 --max-low 8 --method sweep --out ci_artifacts/ci_trace.jsonl --report ci_artifacts/ci_report.md
          python tools/timing_explorer.py replay ci_artifacts/ci_trace.jsonl --sim --exec --trials 2 | tee ci_artifacts/ci_replay.json

      - name: Upload host verification artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: host-verification-logs
          path: |
            ci_artifacts/*.log
            ci_artifacts/*.md
            ci_artifacts/*.json
            ci_artifacts/*.jsonl
